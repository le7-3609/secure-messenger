<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Messenger — Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }

    header { padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--pico-muted-border-color); }
    header h2 { margin: 0; font-size: 1.1rem; }

    #messages { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }

    .bubble { max-width: 65%; padding: 0.5rem 0.85rem; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; }
    .bubble .meta { font-size: 0.72rem; opacity: 0.6; margin-bottom: 0.2rem; }
    .bubble.sent { align-self: flex-end; background: var(--pico-primary-background); color: var(--pico-primary-inverse); border-bottom-right-radius: 3px; }
    .bubble.received { align-self: flex-start; background: var(--pico-card-background-color); border-bottom-left-radius: 3px; }

    footer { padding: 0.75rem 1.5rem; border-top: 1px solid var(--pico-muted-border-color); }
    #send-form { display: flex; gap: 0.5rem; margin: 0; }
    #send-form input[type="text"] { flex: 1; margin: 0; }
    #send-form button { margin: 0; width: auto; }

    #toast-container { position: fixed; bottom: 5rem; right: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 999; }
    .toast { padding: 0.75rem 1.25rem; border-radius: 6px; color: #fff; font-size: 0.9rem; }
    .toast.success { background: #2d6a4f; }
    .toast.error   { background: #9b2226; }
  </style>
</head>
<body>
  <header>
    <h2>💬 Secure Messenger</h2>
    <span id="user-label"></span>
    <button id="btn-logout" class="secondary outline" style="width:auto;padding:0.3rem 0.8rem">Logout</button>
  </header>

  <div id="messages"></div>

  <footer>
    <form id="send-form">
      <input type="text" id="recipient" placeholder="bob, charlie or *" required style="max-width:180px" />
      <input type="text" id="content"   placeholder="Message…"   required />
      <button type="submit">Send</button>
    </form>
  </footer>

  <div id="toast-container"></div>
  <script src="/static/app.js"></script>
  <script>
    const token    = sessionStorage.getItem("token");
    const username = sessionStorage.getItem("username");

    if (!token) window.location.href = "/";

    document.getElementById("user-label").textContent = `👤 ${username}`;
    document.getElementById("btn-logout").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "/";
    });

    // Load history
    apiGetMessages(token).then(messages => {
      messages.forEach(m => addBubble(m.sender, m.content, m.sender === username));
    });

    // SSE
    openStream(token, (sender, content) => {
      addBubble(sender, content, false);
      showToast(`New message from ${sender}`, "success");
    });

    // Send
    document.getElementById("send-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const recipient = document.getElementById("recipient").value.trim();
      const content   = document.getElementById("content").value.trim();
      const recipients = recipient === "*" ? ["*"] : recipient.split(",").map(r => r.trim()).filter(Boolean);
      const ok = await apiSend(token, recipients, content);
      if (ok) {
        addBubble(username, content, true);
        document.getElementById("content").value = "";
      }
    });

    function addBubble(sender, content, sent) {
      const div = document.createElement("div");
      div.className = `bubble ${sent ? "sent" : "received"}`;
      div.innerHTML = `<div class="meta">${sent ? "You" : sender}</div>${escapeHtml(content)}`;
      const feed = document.getElementById("messages");
      feed.appendChild(div);
      feed.scrollTop = feed.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>
</body>
</html>
